name: CI/CD to Lightsail

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/keunoh/feldbuch
  FRONTEND_IMAGE: ghcr.io/keunoh/feldbuch-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs:
      - build-backend
      - build-frontend

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/feldbuch_deploy
          chmod 600 ~/.ssh/feldbuch_deploy
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        run: |
          ssh \
            -i ~/.ssh/feldbuch_deploy \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" << 'EOF'

          set -e

          cd ~/apps/feldbuch

          echo "== Save current image IDs =="

          OLD_BACKEND_IMAGE=$(docker inspect -f '{{.Image}}' feldbuch-app)
          OLD_FRONTEND_IMAGE=$(docker inspect -f '{{.Image}}' feldbuch-frontend)

          echo "Old backend: $OLD_BACKEND_IMAGE"
          echo "Old frontend: $OLD_FRONTEND_IMAGE"

          echo "== Pull new images =="

          docker pull ghcr.io/keunoh/feldbuch:latest
          docker pull ghcr.io/keunoh/feldbuch-frontend:latest

          # ========================================
          # Backend deployment
          # ========================================

          echo "== Stop old backend =="

          docker stop feldbuch-app
          docker rm feldbuch-app

          echo "== Start new backend =="

          docker run -d \
            --name feldbuch-app \
            --network feldbuch-network \
            --restart unless-stopped \
            --env-file .env.prod \
            -p 127.0.0.1:8080:8080 \
            ghcr.io/keunoh/feldbuch:latest

          echo "== Check backend health =="

          BACKEND_HEALTHY=false

          for i in $(seq 1 40); do
            STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8080/actuator/health \
              || true)

            echo "Waiting for backend... ($i/40, status=$STATUS)"

            if [ "$STATUS" = "200" ]; then
              BACKEND_HEALTHY=true
              echo "Backend is healthy."
              break
            fi

            sleep 5
          done

          if [ "$BACKEND_HEALTHY" != "true" ]; then
            echo "Backend health check failed."
            echo "== New backend logs =="

            docker logs feldbuch-app || true

            echo "== Rollback backend =="

            docker rm -f feldbuch-app || true

            docker run -d \
              --name feldbuch-app \
              --network feldbuch-network \
              --restart unless-stopped \
              --env-file .env.prod \
              -p 127.0.0.1:8080:8080 \
              "$OLD_BACKEND_IMAGE"

            echo "Backend rollback completed."
            exit 1
          fi

          # ========================================
          # Frontend deployment
          # ========================================

          echo "== Stop old frontend =="

          docker stop feldbuch-frontend
          docker rm feldbuch-frontend

          echo "== Start new frontend =="

          docker run -d \
            --name feldbuch-frontend \
            --network feldbuch-network \
            --restart unless-stopped \
            -p 127.0.0.1:8081:80 \
            ghcr.io/keunoh/feldbuch-frontend:latest

          echo "== Check frontend health =="

          FRONTEND_HEALTHY=false

          for i in $(seq 1 10); do
            STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8081/ \
              || true)

            echo "Waiting for frontend... ($i/10, status=$STATUS)"

            if [ "$STATUS" = "200" ]; then
              FRONTEND_HEALTHY=true
              echo "Frontend is healthy."
              break
            fi

            sleep 2
          done

          if [ "$FRONTEND_HEALTHY" != "true" ]; then
            echo "Frontend health check failed."

            docker logs feldbuch-frontend || true

            echo "== Rollback frontend =="

            docker rm -f feldbuch-frontend || true

            docker run -d \
              --name feldbuch-frontend \
              --network feldbuch-network \
              --restart unless-stopped \
              -p 127.0.0.1:8081:80 \
              "$OLD_FRONTEND_IMAGE"

            echo "== Rollback backend for version consistency =="

            docker rm -f feldbuch-app || true

            docker run -d \
              --name feldbuch-app \
              --network feldbuch-network \
              --restart unless-stopped \
              --env-file .env.prod \
              -p 127.0.0.1:8080:8080 \
              "$OLD_BACKEND_IMAGE"

            echo "Deployment rolled back."
            exit 1
          fi

          echo "== Deployment completed =="

          docker ps

          EOF