name: CI/CD to Lightsail

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/keunoh/feldbuch
  FRONTEND_IMAGE: ghcr.io/keunoh/feldbuch-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs:
      - build-backend
      - build-frontend

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/feldbuch_deploy
          chmod 600 ~/.ssh/feldbuch_deploy
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        run: |
          ssh \
            -i ~/.ssh/feldbuch_deploy \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" << 'EOF'

          set -e

          cd ~/apps/feldbuch

          echo "== Pull images =="
          docker pull ghcr.io/keunoh/feldbuch:latest
          docker pull ghcr.io/keunoh/feldbuch-frontend:latest

          # ========================================
          # Backend candidate health check
          # ========================================

          echo "== Start backend candidate =="

          docker rm -f feldbuch-app-candidate 2>/dev/null || true

          docker run -d \
            --name feldbuch-app-candidate \
            --network feldbuch-network \
            --env-file .env.prod \
            ghcr.io/keunoh/feldbuch:latest

          echo "== Check backend health =="

          BACKEND_HEALTHY=false

          for i in $(seq 1 30); do

            STATUS=$(docker run --rm \
              --network feldbuch-network \
              curlimages/curl:8.12.1 \
              -s -o /dev/null \
              -w "%{http_code}" \
              http://feldbuch-app-candidate:8080/actuator/health || true)

            if [ "$STATUS" = "200" ]; then
              BACKEND_HEALTHY=true
              echo "Backend candidate is healthy."
              break
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 5
          done

          if [ "$BACKEND_HEALTHY" != "true" ]; then
            echo "Backend candidate health check failed."
            docker logs feldbuch-app-candidate
            docker rm -f feldbuch-app-candidate
            exit 1
          fi

          # ========================================
          # Frontend candidate health check
          # ========================================

          echo "== Start frontend candidate =="

          docker rm -f feldbuch-frontend-candidate 2>/dev/null || true

          docker run -d \
            --name feldbuch-frontend-candidate \
            --network feldbuch-network \
            ghcr.io/keunoh/feldbuch-frontend:latest

          echo "== Check frontend =="

          FRONTEND_HEALTHY=false

          for i in $(seq 1 10); do

            STATUS=$(docker run --rm \
              --network feldbuch-network \
              curlimages/curl:8.12.1 \
              -s -o /dev/null \
              -w "%{http_code}" \
              http://feldbuch-frontend-candidate/ || true)

            if [ "$STATUS" = "200" ]; then
              FRONTEND_HEALTHY=true
              echo "Frontend candidate is healthy."
              break
            fi

            echo "Waiting for frontend... ($i/10)"
            sleep 2
          done

          if [ "$FRONTEND_HEALTHY" != "true" ]; then
            echo "Frontend candidate health check failed."

            docker logs feldbuch-frontend-candidate

            docker rm -f feldbuch-app-candidate
            docker rm -f feldbuch-frontend-candidate

            exit 1
          fi

          # ========================================
          # Candidates passed
          # ========================================

          echo "== Candidate checks passed =="

          docker rm -f feldbuch-app-candidate
          docker rm -f feldbuch-frontend-candidate

          # ========================================
          # Replace backend
          # ========================================

          echo "== Replace backend =="

          docker stop feldbuch-app || true
          docker rm feldbuch-app || true

          docker run -d \
            --name feldbuch-app \
            --network feldbuch-network \
            --restart unless-stopped \
            --env-file .env.prod \
            -p 127.0.0.1:8080:8080 \
            ghcr.io/keunoh/feldbuch:latest

          # ========================================
          # Replace frontend
          # ========================================

          echo "== Replace frontend =="

          docker stop feldbuch-frontend || true
          docker rm feldbuch-frontend || true

          docker run -d \
            --name feldbuch-frontend \
            --network feldbuch-network \
            --restart unless-stopped \
            -p 127.0.0.1:8081:80 \
            ghcr.io/keunoh/feldbuch-frontend:latest

          echo "== Deployment completed =="
          docker ps

          EOF