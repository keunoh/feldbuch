name: CI/CD to Lightsail

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/keunoh/feldbuch
  FRONTEND_IMAGE: ghcr.io/keunoh/feldbuch-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

deploy:
  needs:
    - build-backend
    - build-frontend

  runs-on: ubuntu-latest

  steps:
    - name: Prepare SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/feldbuch_deploy
        chmod 600 ~/.ssh/feldbuch_deploy
        ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy to Lightsail
      run: |
        ssh \
          -i ~/.ssh/feldbuch_deploy \
          "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" << 'EOF'
        
        set -e
        
        cd ~/apps/feldbuch
        
        echo "== Pull images =="
        docker pull ghcr.io/keunoh/feldbuch:latest
        docker pull ghcr.io/keunoh/feldbuch-frontend:latest
        
        echo "== Restart backend =="
        docker stop feldbuch-app || true
        docker rm feldbuch-app || true
        
        docker run -d \
          --name feldbuch-app \
          --network feldbuch-network \
          --restart unless-stopped \
          --env-file .env.prod \
          -p 127.0.0.1:8080:8080 \
          ghcr.io/keunoh/feldbuch:latest
        
        echo "== Restart frontend =="
        docker stop feldbuch-frontend || true
        docker rm feldbuch-frontend || true
        
        docker run -d \
          --name feldbuch-frontend \
          --network feldbuch-network \
          --restart unless-stopped \
          -p 127.0.0.1:8081:80 \
          ghcr.io/keunoh/feldbuch-frontend:latest
        
        echo "== Running containers =="
        docker ps
        
        EOF