name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: feldbuch_vector
          POSTGRES_USER: feldbuch
          POSTGRES_PASSWORD: feldbuch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      # OpenAI
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # JWT
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # OAuth
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # RAG Vector DB
      RAG_DB_URL: jdbc:postgresql://localhost:5432/feldbuch_vector
      RAG_DB_USERNAME: feldbuch
      RAG_DB_PASSWORD: feldbuch

      # Redis
      REDIS_HOST: localhost
      REDIS_PORT: 6379


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      - name: Grant execute permission for Gradle
        run: chmod +x gradlew


      - name: Test backend
        run: ./gradlew clean test



  frontend-build:
    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci


      - name: Build frontend
        working-directory: ./frontend
        run: npm run build