spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/feldbuch
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

conversation:
  auto-completion:
    inactivity-timeout: 30m
    fixed-delay: 10m

server:
  servlet:
    session:
      persistent: false

app:
  frontend-url: http://localhost:5173

rag:
  datasource:
    url: jdbc:postgresql://localhost:5432/feldbuch_vector
    username: feldbuch
    password: feldbuch