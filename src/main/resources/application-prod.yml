spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  batch:
    jdbc:
      initialize-schema: always

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

openai:
  api-key: ${OPENAI_API_KEY}

conversation:
  auto-completion:
    inactivity-timeout: 30m
    fixed-delay: 10m

server:
  servlet:
    session:
      persistent: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

logging:
  file:
    name: /var/log/feldbuch/app.log

app:
  frontend-url: https://feldbuch.duckdns.org