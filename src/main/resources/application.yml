spring:
  application:
    name: feldbuch

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: false

openai:
  base-url: https://api.openai.com/v1
  model: gpt-4.1-nano

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:-} --- [%15.15t] [%X{requestId:-NO_REQUEST}] %-40.40logger{39} : %m%n"
  level:
    root: INFO

    org.springframework.web.client.DefaultRestClient: INFO

    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

    # Hibernate SQL 로그는 P6Spy와 중복되므로 끈다.
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

    # Feldbuch 애플리케이션 로그
    io.github.kaltz.feldbuch: DEBUG

    # P6Spy SQL 로그
    p6spy: INFO

