$kind: http-request
description: |-
  대화에 사용자 메시지를 추가합니다. 생성된 메시지의 ID를 반환합니다.

  **인증**: Bearer Token 필요

  **Path Variables**
  | 변수 | 설명 |
  |------|------|
  | conversationId | 메시지를 추가할 대화 ID |

  **Request Body**
  | 필드 | 타입 | 필수 | 설명 |
  |------|------|------|------|
  | content | string | ✅ | 메시지 내용 |

  **Response** `200 OK`
  ```json
  {
    "data": 1
  }
  ```
url: "{{baseUrl}}/api/conversations/{{conversationId}}/messages"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  conversationId: "{{conversationId}}"
body:
  type: json
  content: |-
    {
      "content": "안녕하세요, 질문이 있습니다."
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 5000
