$kind: http-request
name: Create Conversation Chat
method: POST
url: '{{baseUrl}}/api/conversations/{{conversationId}}/chat'
order: 6000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: conversationId
    value: '{{conversationId}}'
body:
  type: json
  content: |-
    {
      "message": "Spring Boot에 대해 설명해주세요."
    }