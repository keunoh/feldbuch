$kind: http-request
name: Update Conversation
method: PATCH
url: '{{baseUrl}}/api/conversations/{{conversationId}}'
order: 3500
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: conversationId
    value: '{{conversationId}}'
body:
  type: json
  content: |-
    {
      "title": "수정된 대화 제목"
    }
