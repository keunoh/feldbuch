$kind: http-request
description: |-
  새 대화를 생성합니다. 생성된 대화의 ID를 반환합니다.

  **인증**: Bearer Token 필요

  **Request Body**
  | 필드 | 타입 | 필수 | 제약 |
  |------|------|------|------|
  | title | string | ✅ | 100자 이하 |

  **Response** `200 OK`
  ```json
  {
    "data": 1
  }
  ```
url: "{{baseUrl}}/api/conversations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "새 대화"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
