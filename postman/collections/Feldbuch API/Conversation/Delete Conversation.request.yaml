$kind: http-request
description: |-
  대화를 삭제합니다. 해당 대화에 속한 메시지도 함께 삭제됩니다.

  **인증**: Bearer Token 필요

  **Path Variables**
  | 변수 | 설명 |
  |------|------|
  | conversationId | 삭제할 대화 ID |

  **Response** `200 OK`
  ```json
  {
    "data": null
  }
  ```
url: "{{baseUrl}}/api/conversations/{{conversationId}}"
method: DELETE
pathVariables:
  conversationId: "{{conversationId}}"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 6000
