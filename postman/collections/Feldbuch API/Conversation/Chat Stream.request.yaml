$kind: http-request
description: |-
  AI 응답을 SSE(Server-Sent Events) 스트리밍으로 수신합니다. 토큰 단위로 실시간 응답을 받을 수 있습니다.

  **인증**: Bearer Token 필요

  **Path Variables**
  | 변수 | 설명 |
  |------|------|
  | conversationId | 채팅할 대화 ID |

  **Request Body**
  | 필드 | 타입 | 필수 | 설명 |
  |------|------|------|------|
  | message | string | ✅ | AI에게 전송할 메시지 |

  **Response** `text/event-stream`

  각 이벤트는 아래 형식으로 전달됩니다:
  ```json
  { "type": "TOKEN", "content": "Spring" }
  { "type": "TOKEN", "content": " Boot" }
  { "type": "COMPLETE", "content": null }
  ```

  `type` 값: `TOKEN` (응답 토큰) | `COMPLETE` (스트림 종료) | `ERROR` (오류 발생)
url: "{{baseUrl}}/api/conversations/{{conversationId}}/chat/stream"
method: POST
headers:
  Content-Type: application/json
  Accept: text/event-stream
pathVariables:
  conversationId: "{{conversationId}}"
body:
  type: json
  content: |-
    {
      "message": "Spring Boot에 대해 설명해주세요."
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 9000
