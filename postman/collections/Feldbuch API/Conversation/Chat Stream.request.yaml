$kind: http-request
name: Chat Stream
method: POST
url: '{{baseUrl}}/api/conversations/{{conversationId}}/chat/stream'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: text/event-stream
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: conversationId
    value: '{{conversationId}}'
body:
  type: json
  content: |-
    {
      "message": "Spring Boot에 대해 설명해주세요."
    }
