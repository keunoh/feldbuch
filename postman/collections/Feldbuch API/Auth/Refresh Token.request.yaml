$kind: http-request
description: |-
  Refresh Token을 사용해 새로운 Access Token을 발급합니다.

  **인증**: 불필요

  **Request Body**
  | 필드 | 타입 | 필수 | 설명 |
  |------|------|------|------|
  | refreshToken | string | ✅ | 로그인 시 발급된 Refresh Token |

  **Response** `200 OK`
  ```json
  {
    "accessToken": "eyJ...",
    "tokenType": "Bearer"
  }
  ```
url: '{{baseUrl}}/api/auth/refresh'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
order: 2000
