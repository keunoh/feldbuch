$kind: http-request
name: Update Study Status
method: PATCH
url: '{{baseUrl}}/api/notes/{{noteId}}/study-status'
order: 7000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: noteId
    value: '{{noteId}}'
body:
  type: json
  content: |-
    {
      "studyStatus": "IN_PROGRESS"
    }
