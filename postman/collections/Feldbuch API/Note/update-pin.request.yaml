$kind: http-request
name: Update Pin
method: PATCH
url: '{{baseUrl}}/api/notes/{{noteId}}/pin'
order: 6000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: noteId
    value: '{{noteId}}'
body:
  type: json
  content: |-
    {
      "pinned": true
    }
